<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180" viewBox="0 0 320 180" role="img" aria-labelledby="title desc">
  <title id="title">Phil's developer workspace</title>
  <desc id="desc">A clean animated terminal card with Phil's name and a blinking cursor.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071c16"/>
      <stop offset="1" stop-color="#0d3426"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#a3e635"/>
    </linearGradient>
    <clipPath id="card"><rect x="2" y="2" width="316" height="176" rx="18"/></clipPath>
  </defs>
  <style>
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: .28; } 50% { opacity: .55; } }
    .cursor { animation: blink 1.1s steps(1, end) infinite; }
    .glow { animation: pulse 4s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { .cursor, .glow { animation: none; } }
  </style>
  <g clip-path="url(#card)">
    <rect x="2" y="2" width="316" height="176" fill="url(#background)"/>
    <circle class="glow" cx="288" cy="139" r="76" fill="#16a34a" opacity=".35"/>
    <path d="M0 39H320" stroke="#1f5541"/>
    <circle cx="20" cy="21" r="4" fill="#fb7185"/>
    <circle cx="35" cy="21" r="4" fill="#fbbf24"/>
    <circle cx="50" cy="21" r="4" fill="#a3e635"/>
    <text x="68" y="25" fill="#94a3b8" font-family="monospace" font-size="11">phil@workspace</text>
    <text x="24" y="79" fill="#f8fafc" font-family="monospace" font-size="24" font-weight="700">PHIL</text>
    <path d="M24 89H117" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
    <text x="24" y="119" fill="#94a3b8" font-family="monospace" font-size="12">developer · Germany</text>
    <text x="24" y="151" fill="#4ade80" font-family="monospace" font-size="13">$</text>
    <text x="40" y="151" fill="#e2e8f0" font-family="monospace" font-size="13">build something new</text>
    <rect class="cursor" x="207" y="140" width="7" height="14" rx="1" fill="#a3e635"/>
    <path d="M275 70l12 12-12 12M262 94h-21" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <rect x="2" y="2" width="316" height="176" rx="18" fill="none" stroke="#39755d"/>
</svg>
