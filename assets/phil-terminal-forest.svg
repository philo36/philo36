<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180" viewBox="0 0 320 180" role="img" aria-labelledby="title desc">
  <title id="title">Phil's developer workspace</title>
  <desc id="desc">An animated terminal card in layered forest green.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="320" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#071b12"/>
      <stop offset="0.52" stop-color="#123c26"/>
      <stop offset="1" stop-color="#1e663a"/>
    </linearGradient>
    <radialGradient id="halo" cx="270" cy="126" r="83" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#86efac" stop-opacity="0.52"/>
      <stop offset="0.55" stop-color="#4ade80" stop-opacity="0.23"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="24" y1="0" x2="118" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a3e635"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
    <clipPath id="card"><rect x="2" y="2" width="316" height="176" rx="18"/></clipPath>
  </defs>
  <style>
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes breathe { 0%, 100% { opacity: .72; } 50% { opacity: 1; } }
    .cursor { animation: blink 1.1s steps(1, end) infinite; }
    .halo { animation: breathe 4s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { .cursor, .halo { animation: none; } }
  </style>
  <g clip-path="url(#card)">
    <rect x="2" y="2" width="316" height="176" fill="url(#background)"/>
    <circle class="halo" cx="270" cy="126" r="83" fill="url(#halo)"/>
    <circle cx="270" cy="126" r="63" fill="none" stroke="#86efac" stroke-opacity="0.23" stroke-width="1.5"/>
    <rect x="2" y="2" width="316" height="37" fill="#092519" fill-opacity="0.86"/>
    <path d="M2 39H318" stroke="#3d8658" stroke-opacity="0.7"/>
    <circle cx="20" cy="21" r="4" fill="#2f8b52"/>
    <circle cx="35" cy="21" r="4" fill="#4ade80"/>
    <circle cx="50" cy="21" r="4" fill="#a3e635"/>
    <text x="68" y="25" fill="#bbf7d0" font-family="monospace" font-size="11">phil@workspace</text>
    <text x="24" y="79" fill="#f0fdf4" font-family="monospace" font-size="24" font-weight="700">PHIL</text>
    <path d="M24 89H117" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
    <text x="24" y="119" fill="#bbf7d0" font-family="monospace" font-size="12">developer · Germany</text>
    <text x="24" y="151" fill="#a3e635" font-family="monospace" font-size="13">$</text>
    <text x="40" y="151" fill="#dcfce7" font-family="monospace" font-size="13">build something new</text>
    <rect class="cursor" x="207" y="140" width="7" height="14" rx="1" fill="#a3e635"/>
    <path d="M275 70l12 12-12 12M262 94h-21" fill="none" stroke="#bbf7d0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <rect x="2" y="2" width="316" height="176" rx="18" fill="none" stroke="#7bc99a" stroke-opacity="0.55"/>
</svg>
